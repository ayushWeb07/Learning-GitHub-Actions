name: Multiple Steps Hello World Workflow

on:
  workflow_dispatch:

jobs:
  say-hello-world-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello world in bash
        run: echo "Hello World, from bash"

  say-hello-world-python:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello world in python
        shell: python
        run: print "Hello World, from python"