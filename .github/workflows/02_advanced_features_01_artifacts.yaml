name: Data Access via Artifacts Workflow

on:
  workflow_dispatch:

jobs:
  producer:
    runs-on: ubuntu-latest
    steps:
      - name: Create logs
        run: |
          echo "I don't know what to log... Hehe XD" > logs.txt

      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: logs-artifact
          path: logs.txt

  consumer:
    runs-on: ubuntu-latest
    needs: producer
    steps:
      - name: Download logs artifact
        uses: actions/download-artifact@v4
        with:
          name: logs-artifact

      - name: Print logs
        run: cat logs.txt